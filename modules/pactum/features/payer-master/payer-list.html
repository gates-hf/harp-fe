<!-- Payer Master — markup only. All behaviour is in payer-list.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="pm-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Payers</span>
    <span class="spacer"></span>
    <button class="btn btn--primary btn--sm" data-action="new">
      <span class="icon icon--sm">add</span>Add new payer
    </button>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="pm-search" placeholder="Search name in English or Arabic, or licence no." aria-label="Search payers">
      </label>
      <label class="field">
        <span class="icon icon--sm">category</span>
        <select id="pm-type" aria-label="Type"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="pm-status" aria-label="Status"></select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-action="clear">Clear filters</button>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th><button class="sort-btn" data-sort="nameEn">Name (EN)<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="type">Type<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="licenseNo">Licence no.<span class="icon">unfold_more</span></button></th>
          <th>Primary contact</th>
          <th><button class="sort-btn" data-sort="status">Status<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="updatedAt">Last updated<span class="icon">unfold_more</span></button></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="pm-rows"></tbody>
    </table>

    <div id="pm-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="pm-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
