<!-- Charge Description Master — markup only. All behaviour is in cdm-list.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="cd-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Charge lines</span>
    <span class="spacer"></span>
    <a class="btn btn--secondary btn--sm" href="#/pactum/cdm/bundles">
      <span class="icon icon--sm">inventory_2</span>Bundles
    </a>
    <a class="btn btn--secondary btn--sm" href="#/pactum/cdm/import">
      <span class="icon icon--sm">upload_file</span>Bulk import
    </a>
    <button class="btn btn--primary btn--sm" data-action="new">
      <span class="icon icon--sm">add</span>Add item
    </button>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="cd-search" placeholder="Search charge code or description" aria-label="Search charge lines">
      </label>
      <label class="field">
        <span class="icon icon--sm">sell</span>
        <select id="cd-kind" aria-label="Line type">
          <option value="">Items and bundles</option>
          <option value="item">Items only</option>
          <option value="bundle">Bundles only</option>
        </select>
      </label>
      <label class="field">
        <span class="icon icon--sm">category</span>
        <select id="cd-category" aria-label="Category"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="cd-status" aria-label="Status"></select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-action="clear">Clear filters</button>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th><button class="sort-btn" data-sort="chargeCode">Charge code<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="descriptionEn">Description<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="category">Category<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="uom">UoM<span class="icon">unfold_more</span></button></th>
          <th class="num"><button class="sort-btn" data-sort="standardPrice">Standard price<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="status">Status<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="updatedAt">Last updated<span class="icon">unfold_more</span></button></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="cd-rows"></tbody>
    </table>

    <div id="cd-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="cd-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
