<!-- Activity — markup only. All behaviour is in activity-list.js. -->

<div class="panel">
  <div class="panel-header">
    <span>Activity</span>
    <span class="spacer"></span>
    <a class="btn btn--secondary btn--sm" href="#/pactum/home">
      <span class="icon icon--sm">arrow_back</span>Back to home
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="ac-search" placeholder="Search action, user or record" aria-label="Search activity">
      </label>
      <label class="field">
        <span class="icon icon--sm">apps</span>
        <select id="ac-module" aria-label="Module"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="ac-entity" aria-label="Entity type"></select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-action="clear">Clear filters</button>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th>When</th>
          <th>User</th>
          <th>Action</th>
          <th>Record</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody id="ac-rows"></tbody>
    </table>

    <div id="ac-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="ac-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
