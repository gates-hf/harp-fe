<!-- One payer's contracts — markup only. Behaviour is in payer-contracts.js. -->

<div class="panel">
  <div class="panel-header">
    <span id="pc-title">Contracts</span>
    <span class="spacer"></span>
    <a class="btn btn--secondary btn--sm" href="#/pactum/payers">
      <span class="icon icon--sm">arrow_back</span>Back to payers
    </a>
    <button class="btn btn--primary btn--sm" data-action="new">
      <span class="icon icon--sm">add</span>Add contract
    </button>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="pc-status" aria-label="Status"></select>
      </label>
      <span class="spacer"></span>
      <span class="t-body-sm" id="pc-count"></span>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th>Contract name</th>
          <th>Contract no.</th>
          <th class="num">Version</th>
          <th>Start</th>
          <th>End</th>
          <th>Status</th>
          <th>Last updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="pc-rows"></tbody>
    </table>

    <div id="pc-empty" hidden></div>
  </div>
</div>
