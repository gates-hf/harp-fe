<!-- Contracts (global) — markup only. All behaviour is in contracts-global.js. -->

<div class="metric-rail" id="cg-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Active contracts</span>
    <span class="spacer"></span>
    <a class="btn btn--secondary btn--sm" href="#/pactum/payers">
      <span class="icon icon--sm">account_balance</span>Payer Master
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="cg-search" placeholder="Search payer, contract name or number" aria-label="Search contracts">
      </label>
      <label class="field">
        <span class="icon icon--sm">category</span>
        <select id="cg-type" aria-label="Payer type"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">event_busy</span>
        <select id="cg-expiring" aria-label="Expiring within"></select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-action="clear">Clear filters</button>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th>Payer</th>
          <th>Contract name</th>
          <th>Contract no.</th>
          <th class="num">Version</th>
          <th>Start</th>
          <th>End</th>
          <th class="num">No. of rules</th>
          <th>Last updated</th>
        </tr>
      </thead>
      <tbody id="cg-rows"></tbody>
    </table>

    <div id="cg-empty" hidden></div>
  </div>
</div>
