<!-- Standard Codes — the landing. Markup only; behaviour is in standard-codes.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="sc-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Code systems</span>
    <span class="spacer"></span>
    <button class="btn btn--primary btn--sm" data-action="new">
      <span class="icon icon--sm">add</span>Add system
    </button>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="sc-search" placeholder="Search name or type" aria-label="Search code systems">
      </label>
      <label class="field">
        <span class="icon icon--sm">category</span>
        <select id="sc-type" aria-label="System type"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="sc-status" aria-label="Status"></select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-action="clear">Clear filters</button>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th><button class="sort-btn" data-sort="name">Name<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="systemType">Type<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="current">Current version<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="versions">Versions<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="codes">Codes in force<span class="icon">unfold_more</span></button></th>
          <th>Valid</th>
          <th><button class="sort-btn" data-sort="status">Status<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="updatedAt">Last updated<span class="icon">unfold_more</span></button></th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="sc-rows"></tbody>
    </table>

    <div id="sc-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="sc-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
