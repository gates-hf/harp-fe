<!-- Rules tab — markup only. tab-rules.js fills every region. -->

<div class="toolbar">
  <span class="t-title-sm">Evaluation</span>
  <span class="segmented" id="tr-evaluation" role="group" aria-label="How rules are evaluated"></span>
  <span class="t-body-sm" id="tr-evaluation-hint"></span>
  <span class="spacer"></span>
  <span class="t-body-sm" id="tr-count"></span>
  <span id="tr-actions"></span>
</div>

<div id="tr-conflicts"></div>

<table class="tbl" id="tr-table">
  <thead>
    <tr>
      <th class="num">Priority</th>
      <th>Rule</th>
      <th>Conditions</th>
      <th>Action</th>
      <th>Status</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="tr-rows"></tbody>
</table>

<div id="tr-empty" hidden></div>

<p class="t-body-sm" id="tr-hint"></p>
