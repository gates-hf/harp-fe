<!-- Write-off worklist — markup only. All behaviour is in writeoff-worklist.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="wo-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Write-offs</span>
    <span class="icon icon--sm" tabindex="0" role="img" aria-label="How a write-off moves"
          title="A request is signed at the tier its amount needs, then posted against the claim's open balance or the patient's account. Nobody signs their own request. Posting re-checks what is still outstanding and never writes off more than that.">info</span>
    <span class="spacer"></span>
    <div class="segmented" id="wo-scope" role="group" aria-label="Scope">
      <button data-scope="all" aria-pressed="true">All</button>
      <button data-scope="mine" aria-pressed="false" id="wo-mine">Pending my approval</button>
    </div>
    <a class="btn btn--secondary btn--sm" href="#/claima/writeoffs/analytics">
      <span class="icon icon--sm">insights</span>Analytics
    </a>
    <a class="btn btn--primary btn--sm" href="#/claima/writeoffs/new">
      <span class="icon icon--sm">add</span>New request
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="wo-search" placeholder="Search request, claim, MRN, patient or requester" aria-label="Search write-offs">
      </label>
      <label class="field">
        <span class="icon icon--sm">flag</span>
        <select id="wo-status" aria-label="Status"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">source</span>
        <select id="wo-source" aria-label="Source"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">sell</span>
        <select id="wo-reason" aria-label="Reason"></select>
      </label>
    </div>
    <div class="toolbar">
      <label class="field">
        <span class="icon icon--sm">category</span>
        <select id="wo-class" aria-label="Classification"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">payments</span>
        <select id="wo-band" aria-label="Amount band"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">swap_horiz</span>
        <select id="wo-side" aria-label="Side"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="wo-from" aria-label="Requested from">
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="wo-to" aria-label="Requested to">
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-act="clear">Clear filters</button>
    </div>
    <div id="wo-body"></div>
  </div>
</div>
