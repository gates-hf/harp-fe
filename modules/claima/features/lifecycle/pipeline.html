<!-- Pipeline board — markup only. All behaviour is in pipeline.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="panel">
  <div class="panel-header">
    <span>Pipeline</span>
    <span class="badge" id="pb-total" title="Claims on the board and their payer share"></span>
    <span class="icon icon--sm" id="pb-info" tabindex="0" role="img" aria-label="How the board moves"
          title="Cards are not dragged. A claim moves column when something happens to it — it is finalized, batched, submitted, acknowledged, remitted or denied — and the board redraws on the event. Drag would let a card say something the claim’s own record does not.">info</span>
    <span class="spacer"></span>
    <button class="btn btn--secondary btn--sm" data-act="collapse" aria-pressed="false"
            title="Show one card per family — the original claim, its resubmissions, supplementary and secondary claims folded under the newest cycle">
      <span class="icon icon--sm">account_tree</span>Collapse families
    </button>
    <span class="menu-anchor">
      <button class="btn btn--secondary btn--sm" id="pb-columns-btn" aria-haspopup="menu" aria-expanded="false"
              aria-controls="pb-columns" title="Choose which columns the board shows — kept for the session">
        <span class="icon icon--sm">view_column</span>Columns
      </button>
      <div class="menu menu--pop" id="pb-columns" role="menu" hidden></div>
    </span>
    <a class="btn btn--ghost btn--sm" href="#/claima/aging" title="The same claims by status and days in status">
      <span class="icon icon--sm">grid_on</span>Aging
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="pb-search" placeholder="Search claim no., patient or encounter" aria-label="Search claims">
      </label>
      <label class="field">
        <span class="icon icon--sm">apartment</span>
        <select id="pb-payer" aria-label="Payer"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">domain</span>
        <select id="pb-department" aria-label="Department"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">local_hospital</span>
        <select id="pb-type" aria-label="Visit type"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">attach_money</span>
        <select id="pb-band" aria-label="Value band"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">timelapse</span>
        <select id="pb-age" aria-label="Age since assembly"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="pb-from" aria-label="Date of service from">
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="pb-to" aria-label="Date of service to">
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-act="clear">Clear filters</button>
    </div>
    <div id="pb-banner"></div>
    <div id="pb-board"></div>
  </div>
</div>
