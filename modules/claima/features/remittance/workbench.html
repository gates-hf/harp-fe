<!-- Remittance workbench — markup only. All behaviour is in workbench.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="rw-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Remittances</span>
    <span class="spacer"></span>
    <a class="btn btn--secondary btn--sm" href="#/claima/remittances/unapplied">
      <span class="icon icon--sm">account_balance_wallet</span>Unapplied cash
    </a>
    <a class="btn btn--secondary btn--sm" href="#/claima/remittances/new">
      <span class="icon icon--sm">edit_note</span>Manual entry
    </a>
    <a class="btn btn--primary btn--sm" href="#/claima/remittances/upload">
      <span class="icon icon--sm">upload_file</span>Upload ERA
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="rw-search" placeholder="Search remittance, payment ref or claim no." aria-label="Search remittances">
      </label>
      <label class="field">
        <span class="icon icon--sm">apartment</span>
        <select id="rw-payer" aria-label="Payer"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="rw-status" aria-label="Posting status"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="rw-from" aria-label="Payment date from">
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="rw-to" aria-label="Payment date to">
      </label>
      <label class="field">
        <span class="icon icon--sm">account_balance_wallet</span>
        <select id="rw-unapplied" aria-label="Has unapplied cash">
          <option value="">Any residue</option>
          <option value="1">Has unapplied cash</option>
        </select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-act="clear">Clear filters</button>
    </div>
    <div id="rw-body"></div>
  </div>
</div>
