<!-- Example screen — markup only. All behaviour is in example.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="ex-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Patients</span>
    <span class="spacer"></span>
    <button class="btn btn--secondary btn--sm" data-action="export">
      <span class="icon icon--sm">download</span>Export list
    </button>
    <button class="btn btn--primary btn--sm" data-action="new">
      <span class="icon icon--sm">person_add</span>Add patient
    </button>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="ex-search" placeholder="Search MRN, name, civil ID or phone" aria-label="Search patients">
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="ex-status" aria-label="Status"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">location_city</span>
        <select id="ex-city" aria-label="City"></select>
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-action="clear">Clear filters</button>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th><button class="sort-btn" data-sort="nameEn">Patient<span class="icon">unfold_more</span></button></th>
          <th><button class="sort-btn" data-sort="mrn">MRN<span class="icon">unfold_more</span></button></th>
          <th>Status</th>
          <th>Nationality</th>
          <th>City</th>
          <th>Phone</th>
          <th><button class="sort-btn" data-sort="lastVisitAt">Last visit<span class="icon">unfold_more</span></button></th>
        </tr>
      </thead>
      <tbody id="ex-rows"></tbody>
    </table>

    <div id="ex-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="ex-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
