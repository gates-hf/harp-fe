<!-- Patient accounts — markup only. All behaviour is in accounts-list.js. Every
     class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="al-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Patient accounts</span>
    <span class="spacer"></span>
    <a class="btn btn--secondary btn--sm" href="#/frontis/encounters">
      <span class="icon icon--sm">event_available</span>Encounter board
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="al-search" placeholder="Search patient name or MRN" aria-label="Search accounts">
      </label>
      <label class="field">
        <span class="icon icon--sm">account_balance_wallet</span>
        <select id="al-outstanding" aria-label="Outstanding"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">flag</span>
        <select id="al-flag" aria-label="Flags"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="al-from" aria-label="Last transaction from">
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="al-to" aria-label="Last transaction to">
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-act="clear">Clear filters</button>
    </div>

    <div id="al-banner"></div>

    <table class="tbl">
      <thead>
        <tr>
          <th scope="col">Patient</th>
          <th scope="col">Open encounters</th>
          <th scope="col" class="num">Total charges</th>
          <th scope="col" class="num">Patient share</th>
          <th scope="col" class="num">Payments</th>
          <th scope="col" class="num">Deposits held</th>
          <th scope="col" class="num">Outstanding</th>
          <th scope="col">Last transaction</th>
          <th scope="col">Flags</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="al-rows"></tbody>
    </table>

    <div id="al-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="al-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
