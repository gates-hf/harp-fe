<!-- Expected Arrivals — markup only. All behaviour is in prereg-worklist.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="pw-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Expected arrivals</span>
    <span class="spacer"></span>
    <div class="segmented" role="group" aria-label="Scope">
      <button data-scope="upcoming" aria-pressed="true">Today + upcoming</button>
      <button data-scope="all" aria-pressed="false">All</button>
    </div>
    <a class="btn btn--primary btn--sm" href="#/frontis/prereg/new">
      <span class="icon icon--sm">add</span>New pre-registration
    </a>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="pw-search" placeholder="Search pre-reg no., name, phone or civil ID"
               aria-label="Search pre-registrations">
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="pw-status" aria-label="Status"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">category</span>
        <select id="pw-type" aria-label="Visit type"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">apartment</span>
        <select id="pw-department" aria-label="Department"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="pw-from" aria-label="Expected from">
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="pw-to" aria-label="Expected to">
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-act="clear">Clear filters</button>
    </div>

    <div id="pw-banner"></div>

    <table class="tbl">
      <thead>
        <tr>
          <th scope="col">Pre-reg no.</th>
          <th scope="col">Patient</th>
          <th scope="col">Expected arrival</th>
          <th scope="col">Visit type</th>
          <th scope="col">Department / doctor</th>
          <th scope="col">Completeness</th>
          <th scope="col">Pre-check</th>
          <th scope="col">Status</th>
          <th scope="col">Actions</th>
        </tr>
      </thead>
      <tbody id="pw-rows"></tbody>
    </table>

    <div id="pw-empty" hidden></div>

    <div class="tbl-foot">
      <span class="range" id="pw-range"></span>
      <span class="pager">
        <button class="btn btn--secondary btn--sm" data-page="prev">
          <span class="icon icon--sm">chevron_left</span>Previous
        </button>
        <button class="btn btn--secondary btn--sm" data-page="next">
          Next<span class="icon icon--sm">chevron_right</span>
        </button>
      </span>
    </div>
  </div>
</div>
