<!-- Defensio appeal tracking worklist — markup only. All behaviour is in appeal-tracking.js.
     Every class here comes from the design system; a feature never adds CSS. -->

<div class="metric-rail" id="at-metrics"></div>

<div class="panel">
  <div class="panel-header">
    <span>Appeal tracking</span>
    <span class="icon icon--sm" tabindex="0" role="img" aria-label="How the list is ordered"
          title="Submitted appeals sit first, the payer's response deadline soonest at the top and overdue ones painted, then the decided cases newest first. Two clocks are kept apart: the filing deadline is the denial's (the payer's appeal window), the response deadline is the payer's (how long it has to answer a submitted appeal). Defensio never posts cash — a conceded amount is recovered when Claima posts the remittance."></span>
    <span class="spacer"></span>
    <button class="btn btn--primary btn--sm" data-act="bulk-followup" id="at-bulk-followup">
      <span class="icon icon--sm">call</span>Follow up selection
    </button>
  </div>
  <div class="panel-body">
    <div class="toolbar">
      <label class="field field--grow">
        <span class="icon icon--sm">search</span>
        <input type="search" id="at-search" placeholder="Search case, denial, claim no. or payer reference" aria-label="Search appeal cases">
      </label>
      <label class="field">
        <span class="icon icon--sm">apartment</span>
        <select id="at-payer" aria-label="Payer"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">filter_list</span>
        <select id="at-status" aria-label="Status"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">gavel</span>
        <select id="at-outcome" aria-label="Outcome"></select>
      </label>
      <label class="field">
        <span class="icon icon--sm">payments</span>
        <select id="at-recovery" aria-label="Recovery state"></select>
      </label>
    </div>
    <div class="toolbar">
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="at-from" aria-label="Submitted from">
      </label>
      <label class="field">
        <span class="icon icon--sm">event</span>
        <input type="date" id="at-to" aria-label="Submitted to">
      </label>
      <span class="spacer"></span>
      <button class="btn btn--ghost btn--sm" data-act="clear">Clear filters</button>
    </div>

    <div id="at-body"></div>
  </div>
</div>
