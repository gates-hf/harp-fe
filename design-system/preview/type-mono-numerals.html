<!doctype html>
<!-- @dsCard group="Type" name="Mono & tabular numerals" subtitle="Geist Mono for IDs; tnum for vitals" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mono / numerals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
</head>
<body>
<div class="card">
  <div class="t-caps" style="margin-bottom:14px">Geist Mono · tabular numerals</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18px">
    <div>
      <div class="t-label-sm muted" style="margin-bottom:6px">MRN / IDs (mono)</div>
      <div class="t-mono" style="line-height:1.7">
        MRN-0042-918<br>
        ORD-2026-04-1773<br>
        ENC-A1B2-C3D4
      </div>
    </div>
    <div>
      <div class="t-label-sm muted" style="margin-bottom:6px">Vitals (sans, tnum)</div>
      <div class="tabular-nums" style="font:600 22px/1.35 var(--font-display); color:var(--fg-1)">
        <span style="color:var(--success)">98.6</span> °F &nbsp;
        <span>72</span> bpm<br>
        <span>118</span>/<span>76</span> &nbsp;
        <span style="color:var(--warning)">94</span>% SpO₂
      </div>
    </div>
  </div>
  <div style="margin-top:14px; padding:10px 12px; background:var(--bg-sunken); border-radius:var(--radius-2); font: var(--type-mono-sm); color:var(--fg-2)">
    glucose: 142 mg/dL &nbsp; potassium: 4.1 mmol/L &nbsp; creatinine: 0.9 mg/dL
  </div>
</div>
</body>
</html>
