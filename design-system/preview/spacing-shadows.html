<!doctype html>
<!-- @dsCard group="Spacing" name="Shadows / elevation" subtitle="4 levels + focus rings" viewport="700x240" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadows / elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--bg-canvas); }
  .grid { display:grid; grid-template-columns: repeat(4, 1fr); gap: 18px; padding: 8px 4px 18px; }
  .e { background: var(--bg-surface); border-radius: var(--radius-3); aspect-ratio: 1.4/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .e .lvl { font: var(--type-label); }
  .e .use { font: var(--type-mono-sm); color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="t-caps" style="margin-bottom:10px">Elevation · clinical, low-key</div>
  <div class="grid">
    <div class="e" style="box-shadow: var(--shadow-1)"><div class="lvl">1</div><div class="use">card resting</div></div>
    <div class="e" style="box-shadow: var(--shadow-2)"><div class="lvl">2</div><div class="use">menu, hover</div></div>
    <div class="e" style="box-shadow: var(--shadow-3)"><div class="lvl">3</div><div class="use">popover, dropdown</div></div>
    <div class="e" style="box-shadow: var(--shadow-4)"><div class="lvl">4</div><div class="use">modal, sheet</div></div>
  </div>
  <div style="display:flex; gap:14px; align-items:center; margin-top:6px">
    <div style="padding: 8px 14px; background: var(--bg-surface); border-radius: var(--radius-2); box-shadow: var(--shadow-focus); font: var(--type-label-sm)">Focus ring</div>
    <div style="padding: 8px 14px; background: var(--bg-surface); border-radius: var(--radius-2); box-shadow: var(--shadow-focus-critical); font: var(--type-label-sm)">Critical focus</div>
  </div>
</div>
</body>
</html>
